name: Django CI/CD

on:
  push:
    branches: [ main, develops ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: github_actions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 coverage django-filter factory-boy

    - name: Run flake8
      run: flake8 . --count --max-complexity=10 --statistics --exclude=venv,.git,__pycache__,migrations --ignore=E501,W292,W503

    - name: Run tests
      env:
        DB_NAME: github_actions
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        DEBUG: 1
      run: |
        python manage.py test --verbosity=2 --noinput

    - name: Check migrations
      env:
        DB_NAME: github_actions
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        DEBUG: 1
      run: |
        python manage.py makemigrations --check --dry-run

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develops'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t self-learning-project:${{ github.sha }} .
        docker tag self-learning-project:${{ github.sha }} self-learning-project:latest

    - name: Save image
      run: docker save self-learning-project:latest | gzip > project-image.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: project-image.tar.gz